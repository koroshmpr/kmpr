name: Deploy Theme to WordPress Host

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: themes/kmpr/package-lock.json

      - name: Install dependencies & Build Production Assets (Tailwind + JS)
        working-directory: ./themes/kmpr
        run: |
          npm ci
          npm run production

      - name: Deploy theme files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./themes/kmpr/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            javascript/**
            tailwind/**
            tailwind.css
            postcss.config.mjs
            eslint.config.mjs
            package.json
            package-lock.json

