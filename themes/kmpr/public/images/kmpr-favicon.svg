<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="50%" stop-color="#090d16" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
        </radialGradient>
        <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Squircle -->
    <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
    <rect width="512" height="512" rx="128" fill="url(#ambientGlow)" />
    <rect x="8" y="8" width="496" height="496" rx="120" stroke="#1e293b" stroke-width="6" />
    <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.5" />
    
    <!-- Code Bracket < Left -->
    <path d="M168 180 L88 256 L168 332" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Vertical Spine / Letter K Stem -->
    <line x1="228" y1="130" x2="228" y2="382" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" filter="url(#neon)" />
    
    <!-- Diagonal Branches of K -->
    <path d="M228 256 L338 146" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M260 224 L350 366" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Code Bracket > Right -->
    <path d="M380 196 L436 256 L380 316" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8" />
</svg>