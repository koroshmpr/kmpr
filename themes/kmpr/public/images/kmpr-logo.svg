<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Icon Container Squircle -->
    <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
    <rect x="6" y="6" width="88" height="88" rx="24" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Code Bracket < Left -->
    <path d="M36 34 L22 50 L36 66" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Vertical Spine / Letter K Stem -->
    <line x1="48" y1="28" x2="48" y2="72" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Diagonal Branches of K -->
    <path d="M48 50 L66 32" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M54 45 L68 68" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Code Bracket > Right -->
    <path d="M74 38 L84 50 L74 62" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6" />
    
    <!-- Text Elements -->
    <!-- Brand Name KMPR -->
    <text x="114" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">KMPR<tspan fill="url(#primaryGrad)">.</tspan></text>
    
    <!-- Subtitle: Developer & Architect -->
    <text x="115" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">SOFTWARE ARCHITECT</text>
    
    <!-- Decorative Ambient Pill -->
    <rect x="330" y="32" width="76" height="22" rx="11" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1" />
    <text x="368" y="47" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f59e0b" text-anchor="middle">SENIOR</text>
</svg>